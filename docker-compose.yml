services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: apiwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apiwatch}
      POSTGRES_USER: ${POSTGRES_USER:-apiwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiwatch}
    ports:
      - "${APIWATCH_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - apiwatch-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apiwatch} -d ${POSTGRES_DB:-apiwatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apiwatch-backend
    container_name: apiwatch-backend
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/apiwatch}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-apiwatch}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-apiwatch}
      APIWATCH_SCHEDULER_ENABLED: ${APIWATCH_SCHEDULER_ENABLED:-true}
      APIWATCH_SCHEDULER_INTERVAL_MS: ${APIWATCH_SCHEDULER_INTERVAL_MS:-5000}
      APIWATCH_SCHEDULER_INITIAL_DELAY_MS: ${APIWATCH_SCHEDULER_INITIAL_DELAY_MS:-15000}
      APIWATCH_NOTIFICATIONS_CLAIM_SECONDS: ${APIWATCH_NOTIFICATIONS_CLAIM_SECONDS:-30}
      APIWATCH_NOTIFICATIONS_INSTANCE_ID: ${APIWATCH_NOTIFICATIONS_INSTANCE_ID:-}
      APIWATCH_RETENTION_ENABLED: ${APIWATCH_RETENTION_ENABLED:-true}
      APIWATCH_RETENTION_HEALTH_CHECK_DAYS: ${APIWATCH_RETENTION_HEALTH_CHECK_DAYS:-90}
      APIWATCH_RETENTION_INCIDENT_DAYS: ${APIWATCH_RETENTION_INCIDENT_DAYS:-365}
      APIWATCH_RETENTION_NOTIFICATION_DAYS: ${APIWATCH_RETENTION_NOTIFICATION_DAYS:-90}
      APIWATCH_RETENTION_CRON: ${APIWATCH_RETENTION_CRON:-0 30 2 * * *}
      APIWATCH_FRONTEND_ORIGIN: ${APIWATCH_FRONTEND_ORIGIN:-http://localhost:5173}
      APIWATCH_ENCRYPTION_KEY: ${APIWATCH_ENCRYPTION_KEY:-YXBpd2F0Y2gtZGV2LWVuY3J5cHRpb24ta2V5LTMyYiE=}
      APIWATCH_ADMIN_USERNAME: ${APIWATCH_ADMIN_USERNAME:-admin}
      APIWATCH_ADMIN_PASSWORD: ${APIWATCH_ADMIN_PASSWORD:-admin-change-me}
      APIWATCH_VIEWER_USERNAME: ${APIWATCH_VIEWER_USERNAME:-viewer}
      APIWATCH_VIEWER_PASSWORD: ${APIWATCH_VIEWER_PASSWORD:-viewer-change-me}
      APIWATCH_BLOCK_PRIVATE_TARGETS: ${APIWATCH_BLOCK_PRIVATE_TARGETS:-true}
      APIWATCH_PRIVATE_TARGET_ALLOWLIST: ${APIWATCH_PRIVATE_TARGET_ALLOWLIST:-backend}
      APIWATCH_ALLOW_LOCALHOST_CORS: ${APIWATCH_ALLOW_LOCALHOST_CORS:-false}
      APIWATCH_PROMETHEUS_ENABLED: ${APIWATCH_PROMETHEUS_ENABLED:-true}
      APIWATCH_DEMO_DATA_ENABLED: ${APIWATCH_DEMO_DATA_ENABLED:-true}
      APIWATCH_DEMO_BASE_URL: ${APIWATCH_DEMO_BASE_URL:-http://backend:8080}
    ports:
      - "${APIWATCH_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./apiwatch-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    container_name: apiwatch-frontend
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APIWATCH_BIND_ADDRESS:-127.0.0.1}:5173:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  apiwatch-postgres-data:
