version: 2
updates:
  - package-ecosystem: maven
    directory: /apiwatch-backend
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apiwatch-frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /apiwatch-backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apiwatch-frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
